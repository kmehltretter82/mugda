name: Lean 4 Verification & Regression CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Lean 4 Compiler, Proofs & Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and Lean 4 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: .lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build Lean 4 Library, Metatheory & Native Binary
        run: lake build

      - name: Run Constructive Audit & Full .ma Regression Suite (incl. golden snapshots)
        run: make test

      - name: Set up Node.js (for the browser playground engine)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Differential test — playground engine vs Lean checker
        run: make test-js
